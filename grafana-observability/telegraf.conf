[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUXDB_TOKEN"
  organization = "$INFLUXDB_ORG"
  bucket = "$INFLUXDB_BUCKET"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs"]

[[inputs.diskio]]
[[inputs.mem]]
[[inputs.net]]
[[inputs.system]]
[[inputs.swap]]
[[inputs.netstat]]
[[inputs.processes]]
[[inputs.kernel]]

[[inputs.file]]
  files = ["/sys/devices/virtual/thermal/thermal_zone0/temp"]
  name_override = "cpu_temperature"
  data_format = "value"
  data_type = "integer"

[[inputs.file]]
  files = ["/sys/devices/virtual/thermal/thermal_zone1/temp"]
  name_override = "gpu_temperature"
  data_format = "value"
  data_type = "integer"

[[inputs.file]]
  files = ["/sys/devices/virtual/thermal/thermal_zone5/temp"]
  name_override = "soc0_temperature"
  data_format = "value"
  data_type = "integer"

[[inputs.file]]
  files = ["/sys/devices/virtual/thermal/thermal_zone6/temp"]
  name_override = "soc1_temperature"
  data_format = "value"
  data_type = "integer"

[[inputs.file]]
  files = ["/sys/devices/virtual/thermal/thermal_zone7/temp"]
  name_override = "soc2_temperature"
  data_format = "value"
  data_type = "integer"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"