services:
  postgres:

    image: "postgres:17.12-alpine"
    ports:
      - 5432:5432

    environment:
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
    # persistant bind mount (without ./ it wouldn't be persistant!)
      - ./db-data/:/var/lib/postgresql/data/